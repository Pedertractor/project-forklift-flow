services:
  api-forklift:
    build: .
    container_name: api-forklift
    restart: always
    ports:
      - 3131:3131
    env_file:
      - .env
    # Inside Docker, 127.0.0.1 is this container — use the service name and internal port 5432.
    environment:
      DATABASE_URL: postgresql://docker:docker@postgresql-forklift:5432/forklift_db?schema=public
    depends_on:
      - postgresql-forklift
    networks:
      - forklift-network
    volumes:
      - api_forklift_uploads:/usr/src/app/uploads

  postgresql-forklift:
    image: postgres:16
    container_name: postgresql-forklift
    ports:
      - 5436:5432
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=forklift_db
    networks:
      - forklift-network
    volumes:
      - postgres_data_forklift:/var/lib/postgresql/data

volumes:
  postgres_data_forklift:
  api_forklift_uploads:

networks:
  forklift-network:
    name: forklift-network
